services:
  ui:
    build:
      context: .
      args:
        VITE_APP_NAME: ${VITE_APP_NAME:-Fried Chunks}
    environment:
      PORT: ${PORT:-80}
      API_UPSTREAM: ${API_UPSTREAM:-http://host.docker.internal:8000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${UI_PORT:-3000}:${PORT:-80}"
